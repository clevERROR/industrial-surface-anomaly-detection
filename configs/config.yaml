dataset:
  name: mvtec_ad
  root: data/mvtec_ad
  categories:
    - carpet
    - grid
    - metal_nut
    - screw
  validation_ratio: 0.2
  random_seed: 42

preprocess:
  image_size: 256
  grayscale: true

patch:
  sizes:
    - 64
    - 128
    - 256
  stride: 32

features:
  lbp: true
  hog: true
  gray_statistics: true
  gradient_statistics: true
  pca: false

models:
  - iforest
  - ocsvm
  - knn

evaluation:
  threshold_source: normal_validation
